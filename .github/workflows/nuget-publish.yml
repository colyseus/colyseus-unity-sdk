name: NuGet Publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test nuget/Colyseus.csproj --filter "FullyQualifiedName!~IntegrationTest" --verbosity normal

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Ask NuGet what is live rather than diffing against HEAD~1: a release
      # whose version bump isn't in the tip commit skipped silently, and the
      # job still reported success.
      - name: Check whether this version is already on NuGet
        id: version
        run: |
          CURRENT=$(python3 -c "import json; print(json.load(open('Assets/Colyseus/package.json'))['version'])")
          PUBLISHED=$(curl -sf https://api.nuget.org/v3-flatcontainer/colyseus/index.json \
            | python3 -c "import sys,json; print(' '.join(json.load(sys.stdin)['versions']))" 2>/dev/null || echo "")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if echo " $PUBLISHED " | grep -q " $CURRENT "; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "$CURRENT is already on NuGet — nothing to publish"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Publishing $CURRENT (NuGet has: ${PUBLISHED:-none})"
          fi

      - name: Pack
        if: steps.version.outputs.changed == 'true'
        run: |
          dotnet pack nuget/Colyseus.csproj -c Release -o $GITHUB_WORKSPACE/packages/
          dotnet nuget add source $GITHUB_WORKSPACE/packages/ --name local
          dotnet pack nuget-monogame/Colyseus.MonoGame.csproj -c Release -o $GITHUB_WORKSPACE/packages/

      - name: Publish to NuGet
        if: steps.version.outputs.changed == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push $GITHUB_WORKSPACE/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
